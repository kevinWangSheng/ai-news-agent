# 主题字典 — 各 source 的 queries / focus_keywords 都由此派生
# 002a-source-tuning 产物；003-ingestion-sources 在平移时直接读这里
# 字段:
#   slug             : 唯一,英文小写连字符
#   name_zh / name_en: 显示名
#   keywords_en      : 英文关键词(用于 focus_keywords + 各英文 source query)
#   keywords_zh      : 中文关键词
#   site_queries     : exa_search 站内查询 [{site, query}]
#   kol_topic_queries: Twitter topic 查询
#   github_queries   : GitHub 项目搜索

topics:
  # ===== 协议 / 框架 =====
