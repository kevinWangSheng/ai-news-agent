# AI Agent 技术博客聚合系统配置

# AI Agent 科技资讯源
tech_sources:
  # 时间范围设置 — 专家博客更新较慢，保留 30 天窗口；时效性由 breaking_news 保证
  time_window_days: 30

  # 官方博客（优先级最高）- 聚焦 Agent 相关厂商
  # 每个源支持 fallback_urls: 首选 URL 失败时按顺序尝试
  official_blogs:
    # ===== Tier 1 核心 AI 实验室 =====
    - name: "OpenAI Blog"
      url: "https://openai.com/news/rss.xml"  # 2024 年后的正式 feed
      fallback_urls:
        - "https://openai.com/blog/rss.xml"
        - "https://openai.com/news/rss/"
      type: "rss"
      priority: "critical"

    - name: "Anthropic News"
      url: "https://www.anthropic.com/news"
      type: "web"
      priority: "critical"
      max_items: 20

    - name: "Claude Blog"
      url: "https://claude.com/blog"
      type: "web"
      priority: "critical"
      max_items: 20

    - name: "Google AI Blog"
      url: "https://blog.google/technology/ai/rss/"
      fallback_urls:
        - "https://ai.googleblog.com/feeds/posts/default"
      type: "rss"
      priority: "critical"

    - name: "Google DeepMind"
      url: "https://deepmind.google/blog/rss.xml"
      fallback_urls:
        - "https://deepmind.google/discover/blog/"
      type: "rss"
      priority: "critical"

    - name: "Meta AI Blog"
      url: "https://ai.meta.com/blog/"
      type: "web"
      priority: "critical"
      max_items: 15

    - name: "xAI News"
      url: "https://x.ai/news"
      fallback_urls:
        - "https://github.com/xai-org/grok-1/releases.atom"
      type: "web"
      priority: "critical"
      max_items: 10

    - name: "Mistral News"
      url: "https://mistral.ai/news"
      type: "web"
      priority: "high"
      max_items: 15

    # 注：DeepSeek / Perplexity 官方站无稳定 RSS 且 web 页面 JS 渲染，
    # 依赖 breaking_news 通过 Exa site: 查询覆盖
    - name: "Qwen Blog"
      url: "https://qwen.ai/blog"
      fallback_urls:
        - "https://qwenlm.github.io/"
        - "https://github.com/QwenLM/Qwen/releases.atom"
        - "https://huggingface.co/Qwen/feed"
      type: "web"
      priority: "high"
      max_items: 15

    - name: "Cohere Blog"
      url: "https://cohere.com/blog"
      type: "web"
      priority: "medium"
      max_items: 10

    # ===== Tier 2 Agent 生态 =====
    - name: "HuggingFace Blog"
      url: "https://huggingface.co/blog/feed.xml"
      type: "rss"
      priority: "high"

    - name: "LangChain Blog"
      url: "https://www.langchain.com/blog"
      type: "web"
      priority: "critical"
      max_items: 20

    - name: "LlamaIndex Blog"
      url: "https://medium.com/feed/llamaindex-blog"
      fallback_urls:
        - "https://www.llamaindex.ai/blog"
      type: "rss"
      priority: "high"

    - name: "AutoGen / AG2"
      url: "https://docs.ag2.ai/latest/docs/blog/"
      type: "web"
      priority: "high"
      max_items: 10

    # ===== 002a 新增 (2025-2026 新玩家) — URL 待 003 平移时人工校验 =====
    - name: "Thinking Machines Lab"
      url: "https://thinkingmachines.ai/blog"
