# AI Agent 技术博客聚合系统配置

# AI Agent 科技资讯源
tech_sources:
  # 时间范围设置
  time_window_days: 30

  # 官方博客（优先级最高）- 聚焦 Agent 相关厂商
  official_blogs:
    - name: "OpenAI Blog"
      url: "https://openai.com/blog/rss.xml"
      type: "rss"
      priority: "critical"

    - name: "Anthropic News"
      url: "https://www.anthropic.com/news"
      type: "web"
      priority: "critical"
      max_items: 20

    - name: "Claude Blog"
      url: "https://claude.com/blog"
      type: "web"
      priority: "critical"
      max_items: 20

    - name: "Google AI Blog"
      url: "https://ai.googleblog.com/feeds/posts/default"
      type: "rss"
      priority: "critical"

    - name: "HuggingFace Blog"
      url: "https://huggingface.co/blog/feed.xml"
      type: "rss"
      priority: "high"

    - name: "LangChain Blog"
      url: "https://blog.langchain.dev/rss/"
      type: "rss"
      priority: "critical"

    - name: "AutoGen Blog"
      url: "https://microsoft.github.io/autogen/blog/feed.xml"
      type: "rss"
      priority: "high"

  # 知名AI研究者和博主
  expert_blogs:
    - name: "Simon Willison's Weblog"
      url: "https://simonwillison.net/atom/everything/"
      type: "rss"
      priority: "high"
      tags: ["practical-ai", "llm", "agent"]

    - name: "Sebastian Raschka"
      url: "https://sebastianraschka.com/blog/index.html"
      type: "web"
      priority: "medium"

    - name: "Andrej Karpathy"
      url: "https://karpathy.github.io/feed.xml"
      type: "rss"
      priority: "high"

    - name: "Lilian Weng"
      url: "https://lilianweng.github.io/feed.xml"
      type: "rss"
      priority: "high"
      tags: ["agent", "llm", "research"]

  # AI研究论文
  research_sources:
    - name: "arXiv AI"
      url: "http://export.arxiv.org/rss/cs.AI"
      type: "rss"
      priority: "medium"
      max_items: 5

    - name: "arXiv Multi-Agent Systems"
      url: "http://export.arxiv.org/rss/cs.MA"
      type: "rss"
      priority: "medium"
      max_items: 5

  # 技术社区（Agent 相关）
  community_sources:
    - name: "Hacker News AI"
      search_keywords: ["AI agent", "LangChain", "CrewAI", "MCP", "Claude", "tool use"]
      type: "hackernews"
      priority: "medium"
      min_points: 100

    - name: "Reddit r/MachineLearning"
      url: "https://www.reddit.com/r/MachineLearning/.rss"
      type: "rss"
      priority: "medium"

    - name: "Reddit r/LangChain"
      url: "https://www.reddit.com/r/LangChain/.rss"
      type: "rss"
      priority: "medium"

# ============================================================
# Twitter/X 配置（新增）
# ============================================================
twitter:
  # 搜索时间窗口（天）
  days: 3
  # 每个分类最大条目数
  max_items_per_category: 10

  # AI Agent 领域 KOL 列表（Twitter handle）
  kol_accounts:
    # AI 公司领袖
    - "sama"              # Sam Altman - OpenAI CEO
    - "ylecun"            # Yann LeCun - Meta AI
    - "AndrewYNg"         # Andrew Ng
    - "kaboroevich"       # Andrej Karpathy
    # Agent 框架创始人
    - "hwchase17"         # Harrison Chase - LangChain
    - "joaomdmoura"       # João Moura - CrewAI
    - "jerryjliu0"        # Jerry Liu - LlamaIndex
    # AI Agent 领域活跃开发者/研究者
    - "alexalbert__"      # Alex Albert - Anthropic
    - "DrJimFan"          # Jim Fan - NVIDIA
    - "bindureddy"        # Bindu Reddy - Abacus.AI
    - "swyx"              # Swyx - AI Engineer
    - "simonw"            # Simon Willison
    # 中文 AI 圈
    - "dotey"             # 宝玉
    - "9hills"            # 九山

  # KOL 话题补充查询
  kol_topic_queries:
    - "AI agent framework new release announcement"
    - "MCP protocol Claude tool use update"
    - "multi-agent system breakthrough demo"
    - "Claude Code Cursor AI coding agent"

  # 热门讨论查询
  trending_queries:
    - "AI agent best practices production deployment"
    - "LangChain CrewAI AutoGen comparison review"
    - "Claude Sonnet Opus agent coding capability"
    - "AI agent memory context window breakthrough"
    - "open source AI agent tool impressive demo"
    - "AI coding agent benchmark evaluation results"

  # 新发布/新工具查询
  release_queries:
    - "just released launched new AI agent tool"
    - "open source AI agent framework v2 v3 release"
    - "new MCP server plugin released GitHub"
    - "AI agent SDK library just shipped"

# 搜索API配置（Tavily + Exa）
search_apis:
  tavily:
    enabled: true
    search_depth: "basic"
    max_results_per_query: 5
  exa:
    enabled: true
    use_autoprompt: true
    max_results_per_query: 5

# AI Agent 内容搜索配置（通过搜索API主动发现）
ai_content_searches:
  agent_frameworks:
    queries:
      - "LangChain agent tutorial guide 2025 2026"
      - "CrewAI multi-agent tutorial getting started"
      - "AutoGen agent framework tutorial practical"
      - "AI agent framework comparison LangGraph"
    max_items: 10
    days: 14

  agent_protocols:
    queries:
      - "MCP model context protocol server tool tutorial"
      - "LLM tool use function calling implementation guide"
      - "AI agent tool integration API orchestration"
      - "Claude MCP server development practical guide"
    max_items: 10
    days: 14

  agentic_workflows:
    queries:
      - "multi-agent system architecture design pattern"
      - "agentic workflow orchestration deployment production"
      - "AI agent memory planning reasoning implementation"
      - "autonomous agent system building practical"
    max_items: 10
    days: 14

  agent_twitter:
    queries:
      - "AI agent framework LangChain CrewAI AutoGen update"
      - "MCP tool use Claude agent announcement"
      - "multi-agent system open source new release"
    max_items: 8
    days: 7
    exa_only: true

  agent_chinese:
    queries:
      - "AI Agent 智能体 教程 实践 开发"
      - "LangChain MCP 智能体 中文教程"
      - "多智能体 框架 应用 部署"
      - "AI Agent 工具调用 function calling 实践"
    max_items: 10
    days: 14

# 中文平台配置
chinese_platforms:
  enabled: true
  platforms:
    - name: "掘金"
      domain: "juejin.cn"
      keywords: ["AI Agent", "智能体", "LangChain", "MCP", "多智能体"]
      max_items: 8

    - name: "知乎"
      domain: "zhihu.com"
      keywords: ["AI Agent", "智能体", "LangChain", "MCP", "大模型Agent"]
      max_items: 8

    - name: "CSDN"
      domain: "csdn.net"
      keywords: ["AI Agent", "智能体", "LangChain", "MCP", "多智能体"]
      max_items: 8

# GitHub配置（聚焦 Agent 项目）
github:
  trending:
    languages: ["python", "typescript"]
    since: "daily"
    max_items: 10

  topics:
    - "ai-agent"
    - "llm-agent"
    - "langchain"
    - "crewai"
    - "autogen"
    - "mcp-server"
    - "multi-agent"
  max_topic_searches: 4

  # Star 飙升项目（新增）
  rising_stars:
    days: 7
    min_stars: 50
    max_items: 10
    queries:
      - "ai agent"
      - "mcp server"
      - "llm tool"
      - "multi-agent"
      - "agentic workflow"
      - "claude code"

  # 新项目发现（新增）
  new_projects:
    days: 14
    min_stars: 10
    max_items: 8
    queries:
      - "ai agent framework"
      - "mcp server tool"
      - "llm agent"
      - "agentic workflow"
      - "ai coding agent"

# AI评估配置（Agent 领域专家视角）
evaluation:
  model: "abab6.5s-chat"
  criteria:
    importance_threshold: 6
    min_quality_score: 7

  filters:
    exclude_keywords:
      - "娱乐"
      - "八卦"
      - "明星"
      - "celebrity gossip"
      - "image generation"
      - "stable diffusion"
      - "midjourney"
      - "text to image"

    focus_keywords:
      - "AI Agent"
      - "智能体"
      - "LangChain"
      - "CrewAI"
      - "AutoGen"
      - "MCP"
      - "tool use"
      - "function calling"
      - "multi-agent"
      - "agent framework"
      - "agentic workflow"
      - "agent orchestration"

# 通知配置
notification:
  email:
    enabled: true
    format: "markdown"
    receiver: "ltwoggbuty2mh@gmail.com"

  telegram:
    enabled: false
    format: "markdown"

  schedule:
    times:
      - "08:00"
      - "20:00"
    timezone: "Asia/Shanghai"
