  release_queries:
    - "just released launched new AI agent tool"
    - "open source AI agent framework v2 v3 release"
    - "new MCP server plugin released GitHub"
    - "AI agent SDK library just shipped"

# ============================================================
# Breaking News 配置（最重要 — 专抓当日发布内容）
# ============================================================
breaking_news:
  enabled: true
  days: 2                 # 搜索最近 N 天（默认 2 天缓冲，避开时区误差）
  max_items_per_query: 8  # 每个查询返回数量
  total_max_items: 25     # 整个板块最终展示数量上限

  # 方案 1：站点限定的时效搜索（Exa 按 start_published_date 过滤）
  site_queries:
    - site: "openai.com"
      query: "OpenAI"
    - site: "anthropic.com"
      query: "Anthropic announcement release"
    - site: "claude.com"
      query: "Claude release update"
    - site: "deepmind.google"
      query: "DeepMind release"
    - site: "blog.google"
      query: "Google AI Gemini agent"
    - site: "ai.meta.com"
      query: "Meta AI model release"
    - site: "x.ai"
      query: "xAI Grok release"
    - site: "mistral.ai"
      query: "Mistral release"
    - site: "deepseek.com"
      query: "DeepSeek release"
    - site: "perplexity.ai"
      query: "Perplexity release"
    - site: "langchain.com"
      query: "LangChain LangGraph release"
    - site: "llamaindex.ai"
      query: "LlamaIndex release"
    - site: "huggingface.co"
      query: "HuggingFace release agent model"

  # 方案 2：泛关键词时效搜索（跨源抓取突发新闻）
  keyword_queries:
    - "OpenAI announces released new"
    - "Anthropic Claude launches unveils"
    - "new AI agent framework released today"
    - "MCP server protocol update announcement"
    - "LLM model launch benchmark today"
    - "AI Agent breakthrough release"

  # 方案 3：官方源'今日窗口'前置拉取（走 RSS，Breaking 模式下窗口=1天）
  prioritize_official_rss: true

# 搜索API配置（Tavily + Exa）
search_apis:
  tavily:
    enabled: true
    search_depth: "basic"
    max_results_per_query: 5
  exa:
    enabled: true
    use_autoprompt: true
    max_results_per_query: 5

# AI Agent 内容搜索配置（通过搜索API主动发现）
ai_content_searches:
  agent_frameworks:
    queries:
      - "LangChain agent tutorial guide 2025 2026"
      - "CrewAI multi-agent tutorial getting started"
      - "AutoGen agent framework tutorial practical"
      - "AI agent framework comparison LangGraph"
    max_items: 10
    days: 14

  agent_protocols:
    queries:
      - "MCP model context protocol server tool tutorial"
      - "LLM tool use function calling implementation guide"
      - "AI agent tool integration API orchestration"
      - "Claude MCP server development practical guide"
    max_items: 10
    days: 14

  agentic_workflows:
    queries:
      - "multi-agent system architecture design pattern"
      - "agentic workflow orchestration deployment production"
      - "AI agent memory planning reasoning implementation"
      - "autonomous agent system building practical"
    max_items: 10
    days: 14

  agent_twitter:
    queries:
      - "AI agent framework LangChain CrewAI AutoGen update"
      - "MCP tool use Claude agent announcement"
      - "multi-agent system open source new release"
    max_items: 8
    days: 7
    exa_only: true

  agent_chinese:
    queries:
      - "AI Agent 智能体 教程 实践 开发"
      - "LangChain MCP 智能体 中文教程"
      - "多智能体 框架 应用 部署"
      - "AI Agent 工具调用 function calling 实践"
    max_items: 10
    days: 14

