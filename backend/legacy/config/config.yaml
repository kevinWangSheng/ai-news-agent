  model: "abab6.5s-chat"
  criteria:
    importance_threshold: 6
    min_quality_score: 7

  filters:
    exclude_keywords:
      - "娱乐"
      - "八卦"
      - "明星"
      - "celebrity gossip"
      - "image generation"
      - "stable diffusion"
      - "midjourney"
