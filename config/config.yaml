# AI Agent 技术博客聚合系统配置

# AI Agent 科技资讯源
tech_sources:
  # 时间范围设置
  time_window_days: 30

  # 官方博客（优先级最高）- 聚焦 Agent 相关厂商
  official_blogs:
    - name: "OpenAI Blog"
      url: "https://openai.com/blog/rss.xml"
      type: "rss"
      priority: "critical"

    - name: "Anthropic News"
      url: "https://www.anthropic.com/news"
      type: "web"
      priority: "critical"
      max_items: 20

    - name: "Claude Blog"
      url: "https://claude.com/blog"
      type: "web"
      priority: "critical"
      max_items: 20

    - name: "Google AI Blog"
      url: "https://ai.googleblog.com/feeds/posts/default"
      type: "rss"
      priority: "critical"

    - name: "HuggingFace Blog"
      url: "https://huggingface.co/blog/feed.xml"
      type: "rss"
      priority: "high"

    - name: "LangChain Blog"
      url: "https://blog.langchain.dev/rss/"
      type: "rss"
      priority: "critical"

    - name: "AutoGen Blog"
      url: "https://microsoft.github.io/autogen/blog/feed.xml"
      type: "rss"
      priority: "high"

  # 知名AI研究者和博主
  expert_blogs:
    - name: "Simon Willison's Weblog"
      url: "https://simonwillison.net/atom/everything/"
      type: "rss"
      priority: "high"
      tags: ["practical-ai", "llm", "agent"]

    - name: "Sebastian Raschka"
      url: "https://sebastianraschka.com/blog/index.html"
      type: "web"
      priority: "medium"

    - name: "Andrej Karpathy"
      url: "https://karpathy.github.io/feed.xml"
      type: "rss"
      priority: "high"

    - name: "Lilian Weng"
      url: "https://lilianweng.github.io/feed.xml"
      type: "rss"
      priority: "high"
      tags: ["agent", "llm", "research"]

  # AI研究论文
  research_sources:
    - name: "arXiv AI"
      url: "http://export.arxiv.org/rss/cs.AI"
      type: "rss"
      priority: "medium"
      max_items: 5

    - name: "arXiv Multi-Agent Systems"
      url: "http://export.arxiv.org/rss/cs.MA"
      type: "rss"
      priority: "medium"
      max_items: 5

  # 技术社区（Agent 相关）
  community_sources:
    - name: "Hacker News AI"
      search_keywords: ["AI agent", "LangChain", "CrewAI", "MCP", "Claude", "tool use"]
      type: "hackernews"
      priority: "medium"
      min_points: 100

    - name: "Reddit r/MachineLearning"
      url: "https://www.reddit.com/r/MachineLearning/.rss"
      type: "rss"
      priority: "medium"

    - name: "Reddit r/LangChain"
      url: "https://www.reddit.com/r/LangChain/.rss"
      type: "rss"
      priority: "medium"

# 搜索API配置（Tavily + Exa）
search_apis:
  tavily:
    enabled: true
    search_depth: "basic"
    max_results_per_query: 5
  exa:
    enabled: true
    use_autoprompt: true
    max_results_per_query: 5

# AI Agent 内容搜索配置（通过搜索API主动发现）
ai_content_searches:
  agent_frameworks:
    queries:
      - "LangChain agent tutorial guide 2025 2026"
      - "CrewAI multi-agent tutorial getting started"
      - "AutoGen agent framework tutorial practical"
      - "AI agent framework comparison LangGraph"
    max_items: 10
    days: 14

  agent_protocols:
    queries:
      - "MCP model context protocol server tool tutorial"
      - "LLM tool use function calling implementation guide"
      - "AI agent tool integration API orchestration"
      - "Claude MCP server development practical guide"
    max_items: 10
    days: 14

  agentic_workflows:
    queries:
      - "multi-agent system architecture design pattern"
      - "agentic workflow orchestration deployment production"
      - "AI agent memory planning reasoning implementation"
      - "autonomous agent system building practical"
    max_items: 10
    days: 14

  agent_twitter:
    queries:
      - "AI agent framework LangChain CrewAI AutoGen update"
      - "MCP tool use Claude agent announcement"
      - "multi-agent system open source new release"
    max_items: 8
    days: 7
    exa_only: true

  agent_chinese:
    queries:
      - "AI Agent 智能体 教程 实践 开发"
      - "LangChain MCP 智能体 中文教程"
      - "多智能体 框架 应用 部署"
      - "AI Agent 工具调用 function calling 实践"
    max_items: 10
    days: 14

# 中文平台配置
chinese_platforms:
  enabled: true
  platforms:
    - name: "掘金"
      domain: "juejin.cn"
      keywords: ["AI Agent", "智能体", "LangChain", "MCP", "多智能体"]
      max_items: 8

    - name: "知乎"
      domain: "zhihu.com"
      keywords: ["AI Agent", "智能体", "LangChain", "MCP", "大模型Agent"]
      max_items: 8

    - name: "CSDN"
      domain: "csdn.net"
      keywords: ["AI Agent", "智能体", "LangChain", "MCP", "多智能体"]
      max_items: 8

# GitHub配置（聚焦 Agent 项目）
github:
  trending:
    languages: ["python", "typescript"]
    since: "daily"
    max_items: 10

  topics:
    - "ai-agent"
    - "llm-agent"
    - "langchain"
    - "crewai"
    - "autogen"
    - "mcp-server"
    - "multi-agent"
  max_topic_searches: 4

# AI评估配置（Agent 领域专家视角）
evaluation:
  model: "abab6.5s-chat"
  criteria:
    importance_threshold: 6
    min_quality_score: 7

  filters:
    exclude_keywords:
      - "娱乐"
      - "八卦"
      - "明星"
      - "celebrity gossip"
      - "image generation"
      - "stable diffusion"
      - "midjourney"
      - "text to image"

    focus_keywords:
      - "AI Agent"
      - "智能体"
      - "LangChain"
      - "CrewAI"
      - "AutoGen"
      - "MCP"
      - "tool use"
      - "function calling"
      - "multi-agent"
      - "agent framework"
      - "agentic workflow"
      - "agent orchestration"

# 通知配置
notification:
  email:
    enabled: true
    format: "markdown"
    receiver: "ltwoggbuty2mh@gmail.com"

  telegram:
    enabled: false
    format: "markdown"

  schedule:
    times:
      - "08:00"
      - "20:00"
    timezone: "Asia/Shanghai"
