# AI Agent 技术博客聚合系统配置

# AI Agent 科技资讯源
tech_sources:
  # 时间范围设置 — 专家博客更新较慢，保留 30 天窗口；时效性由 breaking_news 保证
  time_window_days: 30

  # 官方博客（优先级最高）- 聚焦 Agent 相关厂商
  # 每个源支持 fallback_urls: 首选 URL 失败时按顺序尝试
  official_blogs:
    # ===== Tier 1 核心 AI 实验室 =====
    - name: "OpenAI Blog"
      url: "https://openai.com/news/rss.xml"  # 2024 年后的正式 feed
      fallback_urls:
        - "https://openai.com/blog/rss.xml"
        - "https://openai.com/news/rss/"
      type: "rss"
      priority: "critical"

    - name: "Anthropic News"
      url: "https://www.anthropic.com/news"
      type: "web"
      priority: "critical"
      max_items: 20

    - name: "Claude Blog"
      url: "https://claude.com/blog"
      type: "web"
      priority: "critical"
      max_items: 20

    - name: "Google AI Blog"
      url: "https://blog.google/technology/ai/rss/"
      fallback_urls:
        - "https://ai.googleblog.com/feeds/posts/default"
      type: "rss"
      priority: "critical"

    - name: "Google DeepMind"
      url: "https://deepmind.google/blog/rss.xml"
      fallback_urls:
        - "https://deepmind.google/discover/blog/"
      type: "rss"
      priority: "critical"

    - name: "Meta AI Blog"
      url: "https://ai.meta.com/blog/"
      type: "web"
      priority: "critical"
      max_items: 15

    - name: "xAI News"
      url: "https://x.ai/news"
      type: "web"
      priority: "critical"
      max_items: 10

    - name: "Mistral News"
      url: "https://mistral.ai/news"
      type: "web"
      priority: "high"
      max_items: 15

    # 注：DeepSeek / Perplexity 官方站无稳定 RSS 且 web 页面 JS 渲染，
    # 依赖 breaking_news 通过 Exa site: 查询覆盖
    - name: "Qwen Blog"
      url: "https://qwen.ai/blog"
      fallback_urls:
        - "https://qwenlm.github.io/"
      type: "web"
      priority: "high"
      max_items: 15

    - name: "Cohere Blog"
      url: "https://cohere.com/blog"
      type: "web"
      priority: "medium"
      max_items: 10

    # ===== Tier 2 Agent 生态 =====
    - name: "HuggingFace Blog"
      url: "https://huggingface.co/blog/feed.xml"
      type: "rss"
      priority: "high"

    - name: "LangChain Blog"
      url: "https://www.langchain.com/blog"
      type: "web"
      priority: "critical"
      max_items: 20

    - name: "LlamaIndex Blog"
      url: "https://medium.com/feed/llamaindex-blog"
      fallback_urls:
        - "https://www.llamaindex.ai/blog"
      type: "rss"
      priority: "high"

    - name: "AutoGen / AG2"
      url: "https://docs.ag2.ai/latest/docs/blog/"
      type: "web"
      priority: "high"
      max_items: 10

  # 知名AI研究者和博主
  expert_blogs:
    # ===== 既有 =====
    - name: "Simon Willison's Weblog"
      url: "https://simonwillison.net/atom/everything/"
      type: "rss"
      priority: "high"
      tags: ["practical-ai", "llm", "agent"]

    - name: "Sebastian Raschka"
      url: "https://sebastianraschka.com/blog/index.html"
      type: "web"
      priority: "medium"

    - name: "Andrej Karpathy"
      url: "https://karpathy.github.io/feed.xml"
      type: "rss"
      priority: "high"

    - name: "Lilian Weng"
      url: "https://lilianweng.github.io/index.xml"
      type: "rss"
      priority: "high"
      tags: ["agent", "llm", "research"]

    # ===== Agent / LLM 实战派 =====
    - name: "Eugene Yan"
      url: "https://eugeneyan.com/rss/"
      type: "rss"
      priority: "high"
      tags: ["agent", "llm", "mlops"]

    - name: "Chip Huyen"
      url: "https://huyenchip.com/feed.xml"
      type: "rss"
      priority: "high"
      tags: ["agent", "llm", "systems"]

    - name: "Hamel Husain"
      url: "https://hamel.dev/index.xml"
      type: "rss"
      priority: "high"
      tags: ["evals", "agent", "llm"]

    - name: "Philipp Schmid"
      url: "https://www.philschmid.de/rss"
      type: "rss"
      priority: "medium"
      tags: ["llm", "agent", "huggingface"]

    - name: "Latent Space (swyx)"
      url: "https://www.latent.space/feed"
      type: "rss"
      priority: "high"
      tags: ["ai-engineer", "agent", "podcast"]

  # AI 新闻聚合源（已帮你筛过的二次源）
  aggregator_sources:
    - name: "The Batch (DeepLearning.AI)"
      url: "https://www.deeplearning.ai/the-batch/"
      type: "web"
      priority: "medium"
      max_items: 10

    - name: "Import AI (Jack Clark)"
      url: "https://jack-clark.net/feed/"
      type: "rss"
      priority: "medium"

    - name: "AINews (smol.ai)"
      url: "https://buttondown.email/ainews/rss"
      type: "rss"
      priority: "medium"

    - name: "Latent Space Newsletter"
      url: "https://www.latent.space/feed"
      type: "rss"
      priority: "medium"

  # AI研究论文
  research_sources:
    - name: "arXiv AI"
      url: "http://export.arxiv.org/rss/cs.AI"
      type: "rss"
      priority: "medium"
      max_items: 5

    - name: "arXiv Multi-Agent Systems"
      url: "http://export.arxiv.org/rss/cs.MA"
      type: "rss"
      priority: "medium"
      max_items: 5

  # 技术社区（Agent 相关）
  community_sources:
    - name: "Hacker News AI"
      search_keywords: ["AI agent", "LangChain", "CrewAI", "MCP", "Claude", "tool use"]
      type: "hackernews"
      priority: "medium"
      min_points: 100

    - name: "Reddit r/MachineLearning"
      url: "https://www.reddit.com/r/MachineLearning/.rss"
      type: "rss"
      priority: "medium"

    - name: "Reddit r/LangChain"
      url: "https://www.reddit.com/r/LangChain/.rss"
      type: "rss"
      priority: "medium"

