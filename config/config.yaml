# GitHub配置（聚焦 Agent 项目）
github:
  trending:
    languages: ["python", "typescript"]
    since: "daily"
    max_items: 10

  topics:
    - "ai-agent"
    - "llm-agent"
    - "langchain"
    - "crewai"
    - "autogen"
    - "mcp-server"
    - "multi-agent"
  max_topic_searches: 4

  # Star 飙升项目（新增）
  rising_stars:
    days: 7
    min_stars: 50
    max_items: 10
    queries:
      - "ai agent"
      - "mcp server"
      - "llm tool"
      - "multi-agent"
      - "agentic workflow"
      - "claude code"

  # 新项目发现（新增）
  new_projects:
    days: 14
    min_stars: 10
    max_items: 8
    queries:
      - "ai agent framework"
      - "mcp server tool"
      - "llm agent"
      - "agentic workflow"
      - "ai coding agent"

# AI评估配置（Agent 领域专家视角）
evaluation:
  model: "abab6.5s-chat"
  criteria:
    importance_threshold: 6
    min_quality_score: 7

  filters:
    exclude_keywords:
      - "娱乐"
      - "八卦"
      - "明星"
      - "celebrity gossip"
      - "image generation"
      - "stable diffusion"
      - "midjourney"
      - "text to image"

    focus_keywords:
      - "AI Agent"
      - "智能体"
      - "LangChain"
      - "CrewAI"
      - "AutoGen"
      - "MCP"
      - "tool use"
      - "function calling"
      - "multi-agent"
      - "agent framework"
      - "agentic workflow"
      - "agent orchestration"

