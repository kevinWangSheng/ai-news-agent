[project]
name = "hub"
version = "0.1.0"
description = "ai-agent-hub CLI"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.9",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-mock>=3.14"]

[project.scripts]
hub = "hub.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub"]
