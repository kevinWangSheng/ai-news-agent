    name_zh: "Model Context Protocol"
    name_en: "MCP"
    keywords_en: ["mcp", "model context protocol"]
    keywords_zh: ["模型上下文协议"]
    site_queries:
      - {site: "anthropic.com", query: "Model Context Protocol"}
    kol_topic_queries: ["MCP protocol Claude tool use update"]
    github_queries: ["MCP server topic"]

  - slug: mcp-server
